name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Validate workflows
        run: bun run check:workflows
      - name: Lint
        run: bun run check
      - name: Typecheck
        run: bun run check:types
      - name: Test
        run: bun test
      - name: Build
        run: bun run build
      # The smoke suite runs against real Astro output; prove the committed fixture
      # still matches what the component actually renders.
      - name: Smoke fixture is current
        run: bun run fixtures:check

  # `astro check` is the only gate covering .astro templates and their client scripts.
  # @astrojs/language-server cannot run on the TypeScript this repo pins (the native
  # 7.x compiler does not expose the programmatic API it needs), so this job installs
  # TS 6 into its own disposable tree. Fold it into `gates` once Astro supports TS 7 --
  # https://github.com/withastro/roadmap/discussions/1321
  astro-check:
    name: Typecheck .astro files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: astro check (TypeScript 6)
        run: bun run check:astro

  compat:
    name: Astro ${{ matrix.astro }} consumer build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        astro: ['4.16.19', '5.18.2', '6.4.8', '7.3.2']
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: bun install --frozen-lockfile
      - name: Build a consumer against Astro ${{ matrix.astro }}
        run: ./scripts/astro-compat-matrix.sh
        env:
          COMPAT_ONLY: ${{ matrix.astro }}
