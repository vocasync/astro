name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Validate workflows
        run: bun run check:workflows
      - name: Lint
        run: bun run check
      - name: Typecheck
        run: bun run check:types
      - name: Test
        run: bun test
      - name: Build
        run: bun run build
      # The smoke suite runs against real Astro output; prove the committed fixture
      # still matches what the component actually renders.
      # This is what actually typechecks the .astro component: it builds a real
      # consumer against the packed package, so a bad frontmatter reference fails the
      # build. `astro check` was tried and removed -- in this repo it reported zero
      # errors for a blatant type error, which is worse than no gate at all.
      - name: Smoke fixture is current
        run: bun run fixtures:check

  compat:
    name: Astro ${{ matrix.astro }} consumer build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        astro: ['4.16.19', '5.18.2', '6.4.8', '7.3.2']
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: bun install --frozen-lockfile
      - name: Build a consumer against Astro ${{ matrix.astro }}
        run: ./scripts/astro-compat-matrix.sh
        env:
          COMPAT_ONLY: ${{ matrix.astro }}
