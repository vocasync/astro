name: Publish to npm

on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Lint
        run: bun run check

      - name: Typecheck
        run: bun run check:types

      - name: Typecheck .astro files
        run: bun run check:astro

      - name: Test
        run: bun test

      - name: Build
        run: bun run build

      # A prerelease tag (v2.0.0-beta.1) must NOT land on the `latest` dist-tag:
      # npm defaults to `latest`, which would hand every `npm i @vocasync/astro`
      # a beta. Derive the tag from the version and publish explicitly.
      - name: Resolve npm dist-tag
        id: disttag
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$VERSION" != "$TAG_VERSION" ]; then
            echo "::error::package.json version ($VERSION) does not match git tag ($TAG_VERSION)."
            exit 1
          fi
          case "$VERSION" in
            *-*) DIST_TAG="next" ;;
            *)   DIST_TAG="latest" ;;
          esac
          echo "version=$VERSION"   >> "$GITHUB_OUTPUT"
          echo "dist_tag=$DIST_TAG" >> "$GITHUB_OUTPUT"
          echo "Publishing $VERSION to dist-tag '$DIST_TAG'."

      - name: Publish to npm
        run: npm publish --access public --provenance --tag "${{ steps.disttag.outputs.dist_tag }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
